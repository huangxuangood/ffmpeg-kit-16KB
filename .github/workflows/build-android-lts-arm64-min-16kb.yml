name: build android lts arm64 min 16kb

on:
  workflow_dispatch:

jobs:
  build-lts-arm64-min:
    name: build android lts arm64 min 16kb
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      AAR_OUTPUT_NAME: ffmpeg-kit-lts-arm64-min-16kb.aar

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autogen \
            autopoint \
            bison \
            build-essential \
            cmake \
            dash \
            gawk \
            gettext \
            git-core \
            gperf \
            groff \
            libtool \
            make \
            nasm \
            ninja-build \
            pkg-config \
            python3 \
            ragel \
            texinfo \
            unzip \
            wget \
            yasm \
            zip \
            binutils

      - name: set up android ndk r27d
        run: |
          curl -L -s "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip" -o ndk.zip
          unzip -q -o ndk.zip -d .ndk

          NDK_DIR="$PWD/.ndk/$(ls .ndk | head -n 1)"

          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_DIR" >> $GITHUB_ENV

      - name: show environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"
          cmake --version || true
          gcc --version || true

      - name: locate ffmpeg configure scripts
        run: |
          echo "===== possible shell scripts ====="
          find . -type f \( -name "*.sh" -o -name "*.mk" -o -name "*.gradle" \) | sort | head -500

          echo "===== configure references ====="
          grep -R "configure" -n . | head -300 || true

          echo "===== extra-ldflags references ====="
          grep -R "extra-ldflags" -n . || true

          echo "===== disable-everything references ====="
          grep -R "disable-everything" -n . || true

          echo "===== enable-filter references ====="
          grep -R "enable-filter" -n . || true

          echo "===== FFMPEG_CONFIGURATION references ====="
          grep -R "FFMPEG_CONFIGURATION" -n . || true

          echo "===== COMMON_FF_CFG_FLAGS references ====="
          grep -R "COMMON_FF_CFG_FLAGS" -n . || true

          echo "===== FFMPEG_CFG_FLAGS references ====="
          grep -R "FFMPEG_CFG_FLAGS" -n . || true

          echo "===== build script files around ffmpeg ====="
          find . -type f | grep -Ei "ffmpeg|android|build" | sort | head -500

      - name: build native lts arm64 min 16kb without archive
        run: |
          chmod +x ./android.sh

          ./android.sh \
            --lts \
            --no-archive \
            --disable-arm-v7a \
            --disable-arm-v7a-neon \
            --disable-x86 \
            --disable-x86-64 \
            --enable-android-zlib

      - name: manually build aar without unit tests
        run: |
          cd android

          chmod +x ./gradlew

          ./gradlew \
            ffmpeg-kit-android-lib:clean \
            ffmpeg-kit-android-lib:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      - name: find and rename aar
        run: |
          echo "Searching AAR outputs..."
          find android -type f -name "*.aar" -print || true
          find prebuilt -type f -name "*.aar" -print || true

          AAR_PATH=$(find android/ffmpeg-kit-android-lib/build/outputs/aar -type f -name "*release*.aar" | head -n 1)

          if [ -z "$AAR_PATH" ]; then
            echo "Error: release AAR not found."
            exit 1
          fi

          echo "AAR_PATH=$AAR_PATH"
          cp "$AAR_PATH" "$AAR_OUTPUT_NAME"

          ls -lh "$AAR_OUTPUT_NAME"

      - name: inspect aar native libraries
        run: |
          rm -rf aar-check
          mkdir aar-check
          unzip -q "$AAR_OUTPUT_NAME" -d aar-check

          echo "Native libraries:"
          find aar-check -name "*.so" -type f -print | sort

          echo "Native library sizes:"
          find aar-check -name "*.so" -type f -exec ls -lh {} \; | sort -k 5 -h

      - name: verify only arm64-v8a
        run: |
          if find aar-check -name "*.so" -type f | grep -E "armeabi-v7a|arm-v7a|x86|x86_64"; then
            echo "Error: AAR contains non-arm64-v8a native libraries."
            exit 1
          fi

          if ! find aar-check -name "*.so" -type f | grep -q "arm64-v8a"; then
            echo "Error: AAR does not contain arm64-v8a native libraries."
            exit 1
          fi

          echo "Only arm64-v8a native libraries found."

      - name: verify 16kb alignment
        run: |
          set -e

          SO_FILES=$(find aar-check -name "*.so" -type f)

          if [ -z "$SO_FILES" ]; then
            echo "Error: no .so files found in AAR."
            exit 1
          fi

          FAILED=0

          for so in $SO_FILES; do
            echo "==== $so ===="
            readelf -l "$so" | grep LOAD || true

            if readelf -l "$so" | grep LOAD | grep -q "0x1000"; then
              echo "Error: $so contains 4KB LOAD alignment."
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "16KB alignment verification failed."
            exit 1
          fi

          echo "16KB alignment verification passed."

      - name: upload aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-lts-arm64-min-16kb-aar
          path: ffmpeg-kit-lts-arm64-min-16kb.aar
          if-no-files-found: error

      - name: print build logs
        if: always()
        run: |
          echo "===== build.log ====="
          if [ -f build.log ]; then
            tail -1000 build.log
          else
            echo "build.log not found"
          fi

          echo "===== all logs ====="
          find . -name "*.log" -type f -print | while read f; do
            echo "===== $f ====="
            tail -300 "$f" || true
          done

          echo "===== aar outputs ====="
          find . -name "*.aar" -type f -print || true

          echo "===== android build output tree ====="
          find android/ffmpeg-kit-android-lib/build -maxdepth 8 -type f -print | head -500 || true

      - name: print ffbuild config log
        if: failure()
        run: |
          if [ -f ./src/ffmpeg/ffbuild/config.log ]; then
            tail -1000 ./src/ffmpeg/ffbuild/config.log
          else
            echo "ffbuild config.log not found"
          fi
